<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="pad-cover" x1="24" y1="20" x2="220" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="pad-header" x1="24" y1="20" x2="220" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="pen-accent" x1="156" y1="140" x2="232" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Notepad body -->
  <rect x="32" y="28" width="176" height="204" rx="22" fill="url(#pad-cover)" stroke="#7DD3FC" stroke-width="4"/>
  <!-- Top binding bar -->
  <rect x="32" y="28" width="176" height="40" rx="18" fill="url(#pad-header)"/>
  <!-- Spiral rings -->
  <rect x="60" y="16" width="12" height="26" rx="6" fill="#E2E8F0"/>
  <rect x="96" y="16" width="12" height="26" rx="6" fill="#E2E8F0"/>
  <rect x="132" y="16" width="12" height="26" rx="6" fill="#E2E8F0"/>
  <rect x="168" y="16" width="12" height="26" rx="6" fill="#E2E8F0"/>
  <!-- Lined pad rules -->
  <line x1="60" y1="96" x2="180" y2="96" stroke="#E0F2FE" stroke-width="8" stroke-linecap="round"/>
  <line x1="60" y1="128" x2="180" y2="128" stroke="#E0F2FE" stroke-width="8" stroke-linecap="round"/>
  <line x1="60" y1="160" x2="156" y2="160" stroke="#E0F2FE" stroke-width="8" stroke-linecap="round"/>
  <line x1="60" y1="192" x2="132" y2="192" stroke="#BAE6FD" stroke-width="8" stroke-linecap="round"/>
  <!-- Pen accent -->
  <path d="M 164 188 L 214 138 L 232 156 L 182 206 L 158 212 Z" fill="url(#pen-accent)" stroke="#FFFBEB" stroke-width="4" stroke-linejoin="round"/>
</svg>
